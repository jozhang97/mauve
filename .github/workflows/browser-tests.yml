name: Browser and reference tests
on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/browser-tests.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/browser-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r web/requirements-dev.txt -r web/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --test web/browser-tests/*.test.mjs
      - run: python -m pytest tests -q
        working-directory: web
      - run: python -m pytest browser-tests -q
        working-directory: web
